- aid: uab:ddd-search
  name: DDD Invenio Search and Export Interface
  description: >-
    The repository's search endpoint returns machine-readable records when given an output
    format: of=xm yields MARC21 XML in the loc.gov/MARC21/slim namespace, of=xd yields
    Dublin Core XML, of=hx yields BibTeX. Responses carry a
    Search-Engine-Total-Number-Of-Results comment; an unrestricted query reported 221,931
    records on 2026-09-01. Anonymous, no key, no registration. This is the practical export
    route for selections that do not map onto an OAI-PMH set, and it is described in the
    same derived contract as the OAI-PMH interface because it runs on the same UAB host.
  humanURL: https://ddd.uab.cat/
  baseURL: https://ddd.uab.cat/search
