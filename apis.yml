- aid: uab:sso-saml-idp
  name: UAB Single Sign-On — SAML 2.0 Identity Provider
  description: >-
    UAB self-publishes a complete SAML 2.0 IdP EntityDescriptor at
    https://sso.uab.cat/cas/idp/metadata (HTTP 200, text/xml), entityID
    https://sso.uab.cat/cas/idp, shibmd:Scope sso.uab.cat. It declares separate signing and
    encryption key descriptors and four SSO bindings — HTTP-POST, HTTP-POST-SimpleSign,
    HTTP-Redirect and SOAP (ECP) — plus HTTP-POST and HTTP-Redirect single logout. This is
    the single most complete machine-readable contract in this profile and, unlike the
    equivalent surface at most institutions in this cohort, it is served from the
    institution's own infrastructure rather than a managed identity vendor's.
  humanURL: https://sso.uab.cat/
  baseURL: https://sso.uab.cat/cas/idp/metadata
  tags:
  - Identity Federation
  - SAML
  - Shibboleth
  - Single Sign-On
  - Apereo CAS
  properties:
  - type: IdentityFederation
    url: https://sso.uab.cat/cas/idp/metadata
  - type: Metadata
    url: identity-federation/uab-sso-cas-saml2-idp-metadata.xml
  - type: Authentication
    url: authentication/uab-authentication.yml
  - type: Conformance
    url: conformance/uab-conformance.yml
  x-operator: institution
  x-operator-basis: >-
    sso.uab.cat resolves to 158.109.121.62, RIPE netname XIUAB — UAB's own address space,
    no CNAME. Server header Apache/2.4.37 (Red Hat Enterprise Linux) with
    X-Application-Context cas-1, i.e. an Apereo CAS instance UAB operates itself. Compare
    Monash, whose Monash-branded IdP terminates on Amazon address space behind AAF's
    managed Rapid IdP; UAB's does not.

- aid: uab:sso-cas
  name: UAB Central Authentication Service (CAS 3.0)
  description: >-
    The CAS protocol face of the same server. https://sso.uab.cat/ redirects to /cas/login
    and the ticket-validation endpoint at /cas/p3/serviceValidate returns a well-formed
    cas:serviceResponse — an INVALID_TICKET authenticationFailure for a deliberately bad
    ticket, which evidences a live protocol endpoint and grants nothing. It is the
    authentication boundary for UAB's own applications, including the virtual campus at
    cv.uab.cat. Service registration is administrative; there is no self-service developer
    path and no published contract.
  humanURL: https://sso.uab.cat/cas/login
  baseURL: https://sso.uab.cat/cas/
  tags:
  - Single Sign-On
  - Apereo CAS
  - Authentication
  properties:
