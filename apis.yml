x-coverage:
  state: covered
  reason: covered
  detail: >-
    Eight institution-operated surfaces were confirmed live and confirmed UAB-owned by IP,
    not by hostname: ddd, traces and ifmuc all CNAME to mompou.uab.cat at 158.109.2.47,
    revistes at 158.109.174.224 and sso at 158.109.121.62, every one of them inside
    158.109.0.0/16 — RIPE netname XIUAB, "Xarxa Informatica de la Universitat Autonoma de
    Barcelona". Four OAI-PMH 2.0 endpoints answered real verbs, an Invenio search interface
    exported MARC21 and Dublin Core without a key, and UAB self-published a full SAML 2.0
    IdP EntityDescriptor from its own CAS server. Evidenced education-regime conformance:
    oai-pmh, saml, shibboleth and crossref as institution-operated, datacite as tenant.

    No specification is published by UAB for any of it. The OpenAPI in openapi/ is DERIVED
    by API Evangelist from live probes and is marked method: derived throughout — it must
    not be read as a UAB contract. There is no developer programme of any kind: no API
    keys, no OAuth authorization server (CAS's OIDC module returns 404 on both discovery
    paths and on /cas/oidc/jwks), no registration, no institutional GitHub organisation,
    and no llms.txt. api.uab.cat, data.uab.cat, opendata.uab.cat, dades.uab.cat,
    idp.uab.cat and cataleg.uab.cat do not resolve at all.

    Three surfaces are real institutional facts on infrastructure UAB does not run and are
    recorded as such rather than deleted: the CORA research-data collection on CSUC's
    Dataverse (84.88.27.173, CESCANET / CSUC Services), the SIR federation entity whose
    endpoints all terminate on sir.rediris.es (130.206.13.20, REDIRIS), and the Crossref
    and ROR registrations. The OJS journal platform is the shared-contract case: UAB runs
    the instance on its own hardware, so the deployment is recorded as institution, while
    PKP's generic REST contract is not saved here.

    Two corrections to the June 2026 profile. The CORA entry's only pointer,
    www.uab.cat/web/research/open-access-uab/open-access-data-1345704463199.html, returns
    HTTP 200 with a body byte-identical to UAB's 404 page — a soft-404 that had been
    reading as a live claim; it is removed and replaced with the verified Catalan open
    science page. And the profile previously asserted that UAB had no confirmed
    institutional identity surface; it has two, one of which it publishes itself.

    Searching in Catalan was load-bearing. The AI policy exists only as
    uab.cat/ca/etica-recerca/artificial, where UAB's research ethics committee subscribes
    to the EU ALTAI trustworthy-AI self-assessment; the Traces and IFMuC repositories were
    found only through DDD's own OAI-PMH friends declaration; and UAB's eduGAIN entity is
    findable only by its RedIRIS-namespaced entityID and its Catalan display name, since
    every "uab" host in eduGAIN belongs to Alabama-Birmingham or Universidade Aberta.
