---
aid: uab
name: Autonomous University of Barcelona
description: >-
  The Universitat Autònoma de Barcelona (UAB) is a public research university in
  Bellaterra, Catalonia, founded in 1968. Unusually for this cohort, its programmable
  footprint is real and is genuinely its own. UAB runs four OAI-PMH 2.0 endpoints on its
  own RIPE allocation — the Dipòsit Digital de Documents (ddd.uab.cat, 221,931 records,
  18 sets, oai_dc / marcxml / edm / oai_openaire), the Traces database of Catalan language
  and literature, the IFMuC inventory of Catalan music collections, and per-journal
  endpoints on its self-hosted OJS platform at revistes.uab.cat — and an Invenio search
  interface that exports MARC21 XML, Dublin Core and BibTeX without a key. It
  self-publishes a complete SAML 2.0 IdP EntityDescriptor from its own Apereo CAS server at
  sso.uab.cat, which is the one institution-published machine-readable contract here, and
  it reaches eduGAIN through the Spanish federation SIR, whose UAB entity is operated on
  RedIRIS's gateway rather than UAB's. UAB is a Crossref member in its own name (member
  3612, prefix 10.5565, 23,089 DOIs) and holds ROR 052g8jq94. What it does not have is a
  developer programme: no OpenAPI is published for anything, api.uab.cat, data.uab.cat and
  opendata.uab.cat do not resolve, there is no API-key or OAuth path, no institutional
  GitHub organisation was found, and www.uab.cat has no llms.txt. Research data is a tenant
  relationship, not a UAB contract: the 567 datasets in UAB's named collection live on the
  CSUC-operated CORA Repositori de Dades de Recerca and carry CSUC's DataCite prefix.
