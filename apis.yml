- aid: uab:cora-rdr
  name: CORA Repositori de Dades de Recerca — UAB collection (CSUC tenant)
  description: >-
    UAB's research data lives in a named collection on CORA RDR, the Dataverse instance
    operated by the Consorci de Serveis Universitaris de Catalunya. The collection API at
    https://dataverse.csuc.cat/api/dataverses/UAB returns alias UAB, name "Universitat
    Autònoma de Barcelona", affiliation UAB and contact ddd.bib@uab.cat, and a subtree
    search returns 567 datasets. Their DOIs carry prefix 10.34810, minted under the DataCite
    client gdcc.csuc. The collection, the datasets and the curation are UAB's; the platform,
    the API contract and the DOI registration are CSUC's. Dataverse's generic specification
    is deliberately not saved under this institution — recording the relationship is the
    point, and deleting it to avoid a misattribution would destroy a real institutional fact.
  humanURL: https://dataverse.csuc.cat/dataverse/UAB
  baseURL: https://dataverse.csuc.cat/api/dataverses/UAB
