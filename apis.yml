apis:
- aid: uab:ddd-oai-pmh
  name: DDD — Dipòsit Digital de Documents de la UAB (OAI-PMH 2.0)
  description: >-
    OAI-PMH 2.0 harvesting endpoint for UAB's institutional repository of theses, articles,
    preprints, postprints, ebooks, rare books, periodicals, graphic documents and political
    posters. Identify returns repositoryName "Dipòsit Digital de Documents de la UAB",
    repositoryIdentifier ddd.uab.cat, adminEmail ddd.bib@uab.cat and an earliest datestamp
    of 2006-03-13. ListMetadataFormats returns four prefixes — oai_dc, marcxml, edm
    (Europeana Data Model) and oai_openaire (OpenAIRE Guidelines) — and ListSets returns 18
    harvestable sets including tesisuab, datasets, artpubuab and uabeuropeana. Identify,
    ListSets, ListMetadataFormats, ListIdentifiers and GetRecord were all exercised and all
    returned HTTP 200. The repository declares CC0 1.0 on its metadata records. The
    software is Invenio; the deployment, the hosts and the records are UAB's.
  humanURL: https://www.uab.cat/en/libraries/digital-document-repository
