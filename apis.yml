    url: authentication/uab-authentication.yml
  x-operator: institution
  x-operator-basis: 158.109.121.62, RIPE netname XIUAB — UAB's own address space, no CNAME.

- aid: uab:sir-federation-entity
  name: UAB in SIR / eduGAIN (RedIRIS federation entity)
  description: >-
    UAB's entry in the Spanish national identity federation SIR, operated by RedIRIS, which
    is how UAB reaches eduGAIN. The EntityDescriptor at entityID
    https://www.rediris.es/sir/uabidp carries OrganizationName "Universitat Autònoma de
    Barcelona" and shibmd:Scope uab.es, and is present in the SIR aggregate at
    https://www.rediris.es/sir/shib1metadata.xml (HTTP 200, 336 entities) and in the eduGAIN
    entity listing as id 680530. Its SSO, SLO and attribute-authority endpoints are all
    per-institution paths on sir.rediris.es, so this entity is federation-operated: UAB's
    identity, RedIRIS's engineering. Recorded, never deleted — a federation is shared by
    definition, and this is one of the strongest institution-linked surfaces a university has.
  humanURL: https://www.rediris.es/sir/
  baseURL: https://www.rediris.es/sir/shib1metadata.xml
