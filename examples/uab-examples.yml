- file: uab-sso-saml2-idp-metadata.xml
  source: https://sso.uab.cat/cas/idp/metadata
  status: 200
  method: probed
  x-operator: institution
  note: >-
    UAB's self-published SAML 2.0 IdP EntityDescriptor, entityID https://sso.uab.cat/cas/idp.
    The one institution-published machine-readable contract in this profile.
- file: uab-crossref-member-3612.json
  source: https://api.crossref.org/members/3612
  status: 200
  method: probed
  x-operator: registry
  note: >-
