specification: API Evangelist Examples
specificationVersion: '0.1'
provider: Autonomous University of Barcelona
providerId: uab
generated: '2026-09-01'
method: probed
source: >-
  Every file in this directory is a verbatim, unedited response captured on 2026-09-01 by
  calling the live endpoint named in its `source` field. Nothing here is synthesised.
description: >-
  Captured responses from the surfaces this profile grades. They exist so a reader can
  check the operator attribution without re-running the probes: the OAI-PMH responses carry
  UAB's own repository identifier and admin address, the SAML metadata is served from UAB's
  own CAS host, and the two JSON files show the difference between a registry membership
  UAB holds in its own name (Crossref member 3612) and a consortium platform UAB is a
  tenant on (the CORA RDR Dataverse collection, contact ddd.bib@uab.cat, on CSUC hardware).
examples:
- file: uab-ddd-oai-identify.xml
  source: https://ddd.uab.cat/oai2d?verb=Identify
  status: 200
  method: probed
  x-operator: institution
  note: OAI-PMH 2.0 Identify for the Dipòsit Digital de Documents de la UAB.
- file: uab-ddd-oai-listmetadataformats.xml
  source: https://ddd.uab.cat/oai2d?verb=ListMetadataFormats
  status: 200
  method: probed
  x-operator: institution
  note: Four metadata prefixes — oai_dc, marcxml, edm, oai_openaire.
- file: uab-ddd-oai-listsets.xml
  source: https://ddd.uab.cat/oai2d?verb=ListSets
  status: 200
  method: probed
  x-operator: institution
