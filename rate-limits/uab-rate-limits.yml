specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Autonomous University of Barcelona
providerId: uab
created: '2026-06-03'
modified: '2026-06-03'
reconciled: false
tags:
- Education
- Higher Education
- University
- Rate Limiting
description: >-
  Autonomous University of Barcelona does not publish a unified public rate-limit table across its APIs, and
  no rate-limit header was returned by any endpoint probed on 2026-09-01. The open
  OAI-PMH and Invenio export endpoints at ddd, traces, ifmuc and revistes may throttle
  large-scale automated harvesting; clients should harvest politely, honor Retry-After,
  and contact ddd.bib@uab.cat for bulk access. An earlier version of this file also
  named IIIF; no IIIF endpoint was found on any UAB host and the claim is withdrawn.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
sources:
- https://raw.githubusercontent.com/api-evangelist/uab/refs/heads/main/apis.yml
responseCodes:
  throttled: 429
limits:
- name: Default
  scope: client
  metric: requests-per-minute
  limit: see service documentation
  notes: No published global limit; large harvests may be rate-limited.
policies:
- name: Backoff Strategy
  description: Exponential backoff with jitter; honor Retry-After; harvest during off-peak hours.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
